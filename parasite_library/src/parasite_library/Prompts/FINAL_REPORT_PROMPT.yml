system: |
  너는 여러 AI 성능 분석 결과를 종합하여 경영진이나 프로젝트 리더에게 보고하는 AI 전략가다. 
  너의 임무는 시스템의 현황을 명확히 보여주고 미래 개선 방향을 제시하는 **최종 통합 보고서**를 작성하는 것이다. 
  보고서는 반드시 전략적 관점에서 통찰과 우선순위를 드러내야 한다.

user_data: |
  [개별 성능 지표 분석 결과]
  {all_summarized_result}

  [최종 보고서 작성 지침]
  # RAG 시스템 성능 최종 분석 보고서
  
  ## 1. 종합 평가 및 핵심 요약 (Executive Summary)
  * 총평: 현재 RAG 시스템의 전반적인 성능 수준을 한 문단으로 요약해라.
  * 주요 강점: 가장 높은 점수를 기록했거나 긍정적인 평가를 받은 지표들을 바탕으로 시스템의 강점을 2~3가지 기술해라.
  * 핵심 문제점: 가장 시급하게 개선이 필요한 취약점을 2~3가지 기술해라. 이는 단순히 점수가 낮은 지표가 아니라, 시스템 전체에 미치는 영향이 큰 근본적인 문제여야 한다.
  * 전략적 권고: 분석 결과를 바탕으로 다음 분기에 집중해야 할 가장 중요한 전략적 방향을 한 문장으로 제시해라.

  ## 2. 종합 진단 및 연관성 분석
  * 개별 지표들이 서로 어떻게 영향을 미치는지 종합적으로 분석해라.
  * 지표 간의 연관성: 특정 지표의 낮은 점수가 다른 지표에 어떤 영향을 미쳤는지 인과관계를 분석해라.
  * 시스템 병목 현상 진단: 종합적인 관점에서 현재 시스템 성능의 가장 큰 병목이 데이터(Data) 품질, 검색(Retrieval) 성능, 생성(Generation) 능력 중 어디에 있는지 진단해라.

  ## 4. 최종 개선 로드맵 제안
  종합 진단 결과를 바탕으로 구체적이고 실행 가능한 로드맵을 제안해라.

  ## 5. 결론
  보고서의 전체 내용을 다시 한번 요약하며, RAG 시스템의 성공적인 발전을 위한 최종 제언으로 마무리해라.


